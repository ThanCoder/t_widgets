name: t_widgets
description: "A collection of reusable Flutter custom widgets designed to simplify UI development, speed up prototyping, and enhance cross-platform apps."
version: 2.7.0
homepage: https://github.com/ThanCoder/t_widgets.git
repository: https://github.com/ThanCoder/t_widgets.git

environment:
  sdk: ^3.12.0
  flutter: ">=3.4.0"

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_spinkit: ^5.2.2

  material_ui: any
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.1.0
